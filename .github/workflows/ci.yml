name: DevFlow CI Workflow

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow_user
          POSTGRES_PASSWORD: devflow_password
          POSTGRES_DB: devflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client & Run Tests
        env:
          DATABASE_URL: postgresql://devflow_user:devflow_password@localhost:5432/devflow_db?schema=public
          JWT_ACCESS_SECRET: devflow_access_secret_super_key_2026_x99!
          JWT_REFRESH_SECRET: devflow_refresh_secret_super_key_2026_z88!
        run: |
          cd server
          npx prisma generate
          npm run test

      - name: Build Backend
        run: |
          cd server
          npm run build

      - name: Install Frontend Dependencies & Build
        run: |
          cd client
          npm ci
          npm run build
