openapi: 3.0.0
info:
  title: DevFlow API
  description: Developer Collaboration & Issue Tracking Platform API Documentation
  version: 1.0.0
servers:
  - url: /api/v1
    description: DevFlow REST API v1
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Vedang Dev" }
                email: { type: string, example: "vedang@devflow.io" }
                password: { type: string, example: "securePassword123" }
      responses:
        201:
          description: User created
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, example: "vedang@devflow.io" }
                password: { type: string, example: "securePassword123" }
      responses:
        200:
          description: Authentication successful
  /organizations:
    get:
      summary: List user organizations
      tags: [Organizations]
      responses:
        200:
          description: List of organizations
    post:
      summary: Create new organization workspace
      tags: [Organizations]
      responses:
        201:
          description: Organization created
  /projects:
    post:
      summary: Create project
      tags: [Projects]
      responses:
        201:
          description: Project created
  /issues/key/{key}:
    get:
      summary: Get issue details by Key (e.g. DEV-101)
      tags: [Issues]
      responses:
        200:
          description: Issue details
